<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles.css" rel="stylesheet">
    <link rel="shortcut icon" href="logo.ico" type="image/x-icon">
    <title>v3.1</title>
</head>

<body>

    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle" aria-hidden="true">

    <header class="app-header">
        <div class="app-header__left">
            <label
                for="sidebar-toggle"
                class="sidebar-menu-btn"
                title="Toggle file list"
                aria-label="Toggle file list"
            >
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M2 4h12M2 8h12M2 12h12"/>
                </svg>
            </label>
            <div id="status-light" class="light searching"></div>
            <h1 class="app-title">Monolv3.1</h1>
            <button
                id="shortcuts-info-btn"
                class="info-btn"
                type="button"
                title="Keyboard shortcuts"
                aria-label="Keyboard shortcuts"
            >
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <circle cx="8" cy="8" r="6.5"/>
                    <path d="M8 7.2V11"/>
                    <circle cx="8" cy="5" r="0.6" fill="currentColor" stroke="none"/>
                </svg>
            </button>
        </div>

        <div class="app-header__passkey">
            <input
                type="password"
                id="passkey"
                class="input input--passkey"
                placeholder="passkey"
                autocomplete="off"
                spellcheck="false"
            >
            <button
                id="clear-passkey-btn"
                class="btn btn--icon btn--icon-only"
                title="Clear passkey"
                type="button"
                aria-label="Clear passkey"
            >
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M4 4l8 8M12 4l-8 8"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="workspace">

        <label for="sidebar-toggle" class="sidebar-backdrop" aria-hidden="true"></label>

        <aside class="sidebar">
            <div class="sidebar__head">
                <span class="label">pages</span>
                <button id="refresh-btn" class="btn btn--sm btn--icon-text" type="button" title="Refresh file list">
                    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M13 3v4H9M3 13V9h4"/>
                        <path d="M12.5 6A5.5 5.5 0 0 0 4 4.5L3 6M3.5 10A5.5 5.5 0 0 0 11 11.5l1-1.5"/>
                    </svg>
                    <span>refresh</span>
                </button>
            </div>
            <ul id="files-list"></ul>
        </aside>

        <main class="editor">

            <div class="toolbar">
                <button id="create-btn" class="btn" type="button">create</button>
                <button id="save-btn" class="btn btn--accent" type="button">save</button>
                <button id="rekey-btn" class="btn hidden" type="button">rekey</button>
                <button id="delete-btn" class="btn btn--danger hidden" type="button">delete</button>
            </div>

            <p id="open-file-name" class="editor__filename" aria-live="polite"></p>

            <div id="rekey-container" class="rekey-panel" style="display:none">
                <span class="label">new passkey</span>
                <input
                    type="password"
                    id="new-passkey"
                    class="input input--new-passkey"
                    placeholder="new passkey"
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="rekey-confirm-btn" class="btn btn--accent" type="button">confirm</button>
                <button id="rekey-cancel-btn" class="btn" type="button">cancel</button>
            </div>

            <div class="editor__body">
                <textarea id="file-text" spellcheck="false"></textarea>
            </div>

        </main>
    </div>

    <footer class="status-bar">
        <div class="status-bar__inner">
            <p id="status-msg"></p>
            <div class="status-bar__nav">
                <button id="prev-file-btn" class="btn btn--icon btn--icon-only btn--nav" type="button" title="Previous file" aria-label="Previous file">
                    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M10 3L5 8l5 5"/>
                    </svg>
                </button>
                <button id="next-file-btn" class="btn btn--icon btn--icon-only btn--nav" type="button" title="Next file" aria-label="Next file">
                    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M6 3l5 5-5 5"/>
                    </svg>
                </button>
                <a href="settings.html" class="btn btn--icon btn--icon-only btn--nav" title="Settings" aria-label="Settings">
                    <svg class="icon" viewBox="0 0 50 50">
                        <path
                            d="M47.16,21.221l-5.91-0.966c-0.346-1.186-0.819-2.326-1.411-3.405l3.45-4.917c0.279-0.397,0.231-0.938-0.112-1.282 l-3.889-3.887c-0.347-0.346-0.893-0.391-1.291-0.104l-4.843,3.481c-1.089-0.602-2.239-1.08-3.432-1.427l-1.031-5.886 C28.607,2.35,28.192,2,27.706,2h-5.5c-0.49,0-0.908,0.355-0.987,0.839l-0.956,5.854c-1.2,0.345-2.352,0.818-3.437,1.412l-4.83-3.45 c-0.399-0.285-0.942-0.239-1.289,0.106L6.82,10.648c-0.343,0.343-0.391,0.883-0.112,1.28l3.399,4.863 c-0.605,1.095-1.087,2.254-1.438,3.46l-5.831,0.971c-0.482,0.08-0.836,0.498-0.836,0.986v5.5c0,0.485,0.348,0.9,0.825,0.985 l5.831,1.034c0.349,1.203,0.831,2.362,1.438,3.46l-3.441,4.813c-0.284,0.397-0.239,0.942,0.106,1.289l3.888,3.891 c0.343,0.343,0.884,0.391,1.281,0.112l4.87-3.411c1.093,0.601,2.248,1.078,3.445,1.424l0.976,5.861C21.3,47.647,21.717,48,22.206,48 h5.5c0.485,0,0.9-0.348,0.984-0.825l1.045-5.89c1.199-0.353,2.348-0.833,3.43-1.435l4.905,3.441 c0.398,0.281,0.938,0.232,1.282-0.111l3.888-3.891c0.346-0.347,0.391-0.894,0.104-1.292l-3.498-4.857 c0.593-1.08,1.064-2.222,1.407-3.408l5.918-1.039c0.479-0.084,0.827-0.5,0.827-0.985v-5.5C47.999,21.718,47.644,21.3,47.16,21.221z M25,32c-3.866,0-7-3.134-7-7c0-3.866,3.134-7,7-7s7,3.134,7,7C32,28.866,28.866,32,25,32z">
                        </path>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <dialog id="shortcuts-dialog" class="shortcuts-dialog">
        <div class="shortcuts-dialog__head">
            <h2 class="shortcuts-dialog__title">keyboard shortcuts</h2>
            <button
                id="shortcuts-close-btn"
                class="btn btn--icon btn--icon-only"
                type="button"
                aria-label="Close shortcuts"
            >
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M4 4l8 8M12 4l-8 8"/>
                </svg>
            </button>
        </div>
        <dl class="shortcuts-list">
            <div class="shortcuts-list__row">
                <dt><kbd>Esc</kbd></dt>
                <dd>Clear passkey</dd>
            </div>
            <div class="shortcuts-list__row">
                <dt><kbd>Enter</kbd></dt>
                <dd>Submit passkey</dd>
            </div>
            <div class="shortcuts-list__row">
                <dt><kbd>Ctrl</kbd></dt>
                <dd>Cycle focus between passkey and editor</dd>
            </div>
            <div class="shortcuts-list__row">
                <dt><kbd>Alt</kbd> + <kbd>←</kbd> / <kbd>→</kbd></dt>
                <dd>Previous / next file</dd>
            </div>
            <div class="shortcuts-list__row">
                <dt><kbd>Alt</kbd> + <kbd>N</kbd></dt>
                <dd>Create new file</dd>
            </div>
            <div class="shortcuts-list__row">
                <dt><kbd>Alt</kbd> + <kbd>S</kbd></dt>
                <dd>Save current file</dd>
            </div>
        </dl>
    </dialog>

    <script src="./script.js" type="module"></script>

</body>

</html>
