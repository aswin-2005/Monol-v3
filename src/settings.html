<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#33d17a">
    <title>Settings</title>
</head>

<body class="settings-page">
    <div class="settings-panel">
        <p class="settings-title">Settings</p>
        <form id="settings-form" class="settings-form">
            <div class="settings-row">
                <label class="settings-label" for="api-secret">API SECRET</label>
                <input class="settings-input" type="password" id="api-secret">
            </div>
            <div class="settings-row">
                <label class="settings-label" for="backend-url">BACKEND URL</label>
                <input class="settings-input" type="password" id="backend-url">
            </div>
            <div class="settings-row">
                <label class="settings-label" for="page-watermark">PAGE WATERMARK</label>
                <input class="settings-input" type="text" id="page-watermark">
            </div>
            <div class="settings-row">
                <label class="settings-label" for="filename-prefix">FILENAME PREFIX</label>
                <input class="settings-input" type="text" id="filename-prefix">
            </div>
            <button type="submit" class="settings-btn">Save</button>
        </form>
        <a href="index.html" class="app-title go-to-home-link">← back to monolv3.1</a>
    </div>
    <script type="module" src="settings.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
